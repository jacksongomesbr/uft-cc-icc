project:
  type: default
  output-dir: ../_output/slides

lang: pt-BR
bibliography: ../references.bib
csl: ../abnt.csl
link-citations: true

format:
  revealjs:
    theme: simple
    slide-number: true
    transition: fade
    # Os títulos de nível 1 viram divisórias de seção, e o Pandoc os transforma
    # em pilhas verticais. Sem isto, a seta para a direita do apresentador de
    # slides pula o conteúdo da seção inteira em vez de avançar um slide.
    navigation-mode: linear
    preview-links: true
    footer: "Introdução à Ciência da Computação — UFT, Câmpus Palmas"
    code-copy: true
    code-overflow: wrap
    code-block-height: 520px
    syntax-highlighting: github
    mermaid:
      theme: neutral

execute:
  echo: true
  warning: false
  freeze: auto
